<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Vigilabebé</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  section{min-height:100%;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}
  [hidden]{display:none!important}
  h1{margin:8px 0 0;font-size:1.6rem}
  p{margin:0;color:var(--mut)}
  button{appearance:none;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:600;background:var(--card);color:var(--txt);cursor:pointer}
  button.big{padding:22px 16px;font-size:1.15rem;text-align:left}
  button.big small{display:block;font-weight:400;color:var(--mut);margin-top:4px}
  button.pri{background:var(--acc);color:#0b1220}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1 1 auto}
  .lenses{display:flex;gap:6px}
  .lenses button{flex:1;padding:12px 6px;border-radius:999px}
  .lenses button.on{background:var(--acc);color:#0b1220}
  .card{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .vwrap{position:relative;overflow:hidden;border-radius:14px;background:#000;aspect-ratio:4/3}
  #view .vwrap{flex:1;min-height:40vh;aspect-ratio:auto}
  .vwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .3s}
  .vwrap.zoom2 video{transform:scale(2)}
  #noiseDot{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--err);box-shadow:0 0 0 4px rgba(239,68,68,.35);animation:pulse 1s infinite;z-index:2}
  @keyframes pulse{50%{transform:scale(1.35);box-shadow:0 0 0 10px rgba(239,68,68,0)}}
  #noiseTag{position:absolute;top:10px;right:44px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:8px;font-size:.85rem;font-weight:700;z-index:2}
  .status{padding:10px 12px;border-radius:10px;background:var(--card);font-weight:600}
  .status::before{content:"●  "}
  .status.ok::before{color:var(--ok)} .status.warn::before{color:var(--warn)} .status.err::before{color:var(--err)}
  .info{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.95rem}
  .info span:nth-child(odd){color:var(--mut)}
  .good{color:var(--ok)} .mid{color:var(--warn)} .bad{color:var(--err)}
  .meter{height:14px;background:#0b1220;border-radius:7px;overflow:hidden;position:relative}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn),var(--err));transition:width .15s}
  .meter b{position:absolute;top:0;bottom:0;width:2px;background:#fff}
  .alarm{animation:flash .5s 4}
  @keyframes flash{50%{box-shadow:0 0 0 6px var(--err) inset;background:#450a0a}}
  #dim{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:24px;color:#333;font-size:.9rem}
  label{display:flex;align-items:center;gap:8px;color:var(--mut)}
  label input[type=checkbox]{width:20px;height:20px}
  input[type=range]{flex:1}
</style>
</head>
<body>

<!-- INICIO -->
<section id="home">
  <h1>👶 Vigilabebé</h1>
  <p>Usa dos móviles: uno se queda junto al bebé como cámara y el otro lo usas tú para mirar.</p>
  <button class="big pri" id="btnCam">📷 Este móvil es la CÁMARA<small>Ponlo junto al bebé y enchúfalo al cargador</small></button>
  <button class="big" id="btnView">👀 VER AL BEBÉ<small>Desde tu móvil, estés donde estés</small></button>
</section>

<!-- CÁMARA -->
<section id="cam" hidden>
  <div class="status warn" id="camStatus">Iniciando cámara…</div>
  <div class="vwrap" id="camWrap"><video id="camVideo" autoplay playsinline muted></video></div>
  <div class="lenses" id="camLenses"></div>
  <button id="btnDim">🌙 Oscurecer pantalla</button>
  <p id="viewersInfo">Monitores conectados: 0</p>
  <button id="btnCamBack">← Salir</button>
</section>

<!-- MONITOR -->
<section id="view" hidden>
  <div class="status warn" id="viewStatus">Conectando…</div>
  <div class="vwrap" id="viewWrap">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <div id="noiseDot" hidden></div><div id="noiseTag" hidden>RUIDO</div>
  </div>
  <div class="lenses" id="viewLenses"></div>
  <button class="pri" id="btnSound">🔊 Activar sonido y avisos</button>
  <div class="card" id="soundCard" hidden>
    <div class="meter"><i id="meterBar"></i><b id="meterMark"></b></div>
    <label>Sensibilidad <input type="range" id="threshold" min="10" max="95" value="60"></label>
    <div class="row">
      <label><input type="checkbox" id="optBeep" checked> Pitido</label>
      <label><input type="checkbox" id="optVibe" checked> Vibración</label>
    </div>
    <p id="lastNoise">Sin ruidos detectados</p>
  </div>
  <div class="card">
    <div class="info">
      <span>🔋 Batería</span><span id="iBat">—</span>
      <span>📶 Red</span><span id="iNet">—</span>
      <span>📡 Conexión</span><span id="iQual">—</span>
      <span>⏱️ Retardo</span><span id="iRtt">—</span>
      <span>🎞️ Vídeo</span><span id="iVid">—</span>
      <span>🛰️ Ruta</span><span id="iRoute">—</span>
    </div>
  </div>
  <div class="row">
    <button id="btnFull">⛶ Pantalla completa</button>
    <button id="btnViewBack">← Salir</button>
  </div>
</section>

<div id="dim" hidden>Toca para volver a encender</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PREFIX = 'vigilabebe-v1-';
const ROOM = 'K7QM4XRP2D'; // código fijo: cámara y monitor se encuentran solos

// Servidores STUN/TURN. El TURN (ExpressTURN) reenvía el vídeo cuando los móviles
// no pueden conectarse directamente, p. ej. con datos móviles.
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  {
    urls: [
      'turn:free.expressturn.com:3478',
      'turn:free.expressturn.com:3478?transport=tcp',
      'turn:free.expressturn.com:443?transport=tcp'
    ],
    username: '000000002110593949',
    credential: 'qylI2+y6BMAtTcoCUc/YW89uVBM='
  }
];
const peerOptions = () => ({ debug: 1, config: { iceServers: ICE_SERVERS } });

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
function show(id){ for (const s of ['home','cam','view']) $('#'+s).hidden = s !== id; }
function setStatus(el, text, cls){ el.textContent = text; el.className = 'status ' + cls; }
const goHome = () => { location.href = location.pathname; };
const ago = ms => { const s = Math.round(ms/1000); return s < 60 ? `hace ${s} s` : `hace ${Math.round(s/60)} min`; };

// Mantener la pantalla encendida
let activeMode = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && activeMode) keepAwake();
});

function renderLenses(el, lenses, current, onPick){
  el.innerHTML = '';
  for (const l of lenses) {
    const b = document.createElement('button');
    b.textContent = l.label; b.className = l.id === current ? 'on' : '';
    b.onclick = () => onPick(l.id);
    el.appendChild(b);
  }
}

/* ===================== MODO CÁMARA ===================== */
let camPeer, localStream, camRetry, lenses = [], devices = {}, digitalZoom = false;
let lens = store.get('lens') || 'wide';
const calls = new Map(), conns = new Map();
const camStatus = (t,c) => setStatus($('#camStatus'), t, c);

async function startCamera(){
  activeMode = 'cam'; show('cam'); keepAwake();
  try {
    await getMedia(lens).catch(() => getMedia(lens = 'wide'));
    await detectLenses();
    // La primera vez aún no se conocían las lentes: abrir la guardada de verdad
    if (lens !== 'wide' && lens !== 'front') await getMedia(lens).catch(() => getMedia(lens = 'wide'));
    showCamLenses();
  } catch (e) { camStatus('No se pudo acceder a la cámara/micrófono: ' + e.message, 'err'); return; }
  connectCamPeer(ROOM);
  setInterval(sendStatus, 3000);
}

// Detecta las lentes del móvil (en iPhone: ultra gran angular, gran angular, teleobjetivo)
async function detectLenses(){
  const vids = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  devices = {};
  for (const d of vids) {
    const l = d.label.toLowerCase();
    if (/front|frontal|delantera|user|face/.test(l)) devices.front ??= d.deviceId;
    else if (/ultra/.test(l)) devices.uw ??= d.deviceId;
    else if (/tele/.test(l)) devices.tele ??= d.deviceId;
    else if (/dual|triple/.test(l)) continue;
    else devices.wide ??= d.deviceId;
  }
  lenses = [];
  if (devices.uw) lenses.push({ id: 'uw', label: '0,5x' });
  lenses.push({ id: 'wide', label: '1x' }, { id: 'x2', label: '2x' });
  if (devices.tele) lenses.push({ id: 'tele', label: '3x' });
  lenses.push({ id: 'front', label: '🤳' });
  showCamLenses();
}
function showCamLenses(){
  renderLenses($('#camLenses'), lenses, lens, switchLens);
  $('#camWrap').classList.toggle('zoom2', digitalZoom);
}

async function switchLens(id){
  if (id === lens) return;
  try { await getMedia(id); lens = id; store.set('lens', id); }
  catch (e) { camStatus('No se pudo cambiar de lente: ' + e.message, 'err'); }
  showCamLenses(); sendStatus();
}

async function getMedia(id){
  let video = { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } };
  if (id === 'front') video.facingMode = 'user';
  else {
    const dev = devices[id === 'x2' ? 'wide' : id];
    if (dev) video.deviceId = { exact: dev }; else video.facingMode = 'environment';
  }
  // En iPhone conviene liberar la cámara anterior antes de abrir otra
  localStream?.getVideoTracks().forEach(t => t.stop());
  const s = await navigator.mediaDevices.getUserMedia({
    video, audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true }
  });
  // 2x: zoom real del sensor si el navegador lo permite; si no, zoom digital en pantalla
  digitalZoom = false;
  if (id === 'x2') {
    const vt = s.getVideoTracks()[0];
    const cap = vt.getCapabilities?.().zoom;
    if (cap && cap.max >= 2) await vt.applyConstraints({ advanced: [{ zoom: 2 }] }).catch(() => { digitalZoom = true; });
    else digitalZoom = true;
  }
  for (const call of calls.values()) {
    for (const sender of call.peerConnection?.getSenders() || []) {
      const t = sender.track && s.getTracks().find(x => x.kind === sender.track.kind);
      if (t) sender.replaceTrack(t);
    }
  }
  localStream?.getTracks().forEach(t => t.stop());
  localStream = s;
  $('#camVideo').srcObject = s;
}

// Datos del móvil de la cámara que se envían al monitor
let battery = null;
navigator.getBattery?.().then(b => battery = b).catch(() => {});
function sendStatus(){
  const c = navigator.connection;
  const msg = {
    type: 'status',
    battery: battery ? { level: Math.round(battery.level * 100), charging: battery.charging } : null,
    net: c ? (c.type && c.type !== 'unknown' ? c.type + ' · ' : '') + (c.effectiveType || '') : null,
    lens, lenses, digitalZoom
  };
  for (const conn of conns.values()) if (conn.open) try { conn.send(msg); } catch {}
}

function updateViewers(){
  $('#viewersInfo').textContent = 'Monitores conectados: ' + calls.size;
  if (camPeer?.open) camStatus(calls.size ? 'Emitiendo en directo' : 'Lista. Esperando al monitor…', 'ok');
}

function retryCam(code, msg, ms){
  camStatus(msg, 'warn');
  clearTimeout(camRetry);
  try { camPeer?.destroy(); } catch {}
  camRetry = setTimeout(() => connectCamPeer(code), ms);
}

function connectCamPeer(code){
  const peer = camPeer = new Peer(PREFIX + code, peerOptions());
  peer.on('open', updateViewers);
  peer.on('connection', conn => {
    conn.on('open', () => {
      const call = peer.call(conn.peer, localStream);
      calls.set(conn.peer, call); conns.set(conn.peer, conn); updateViewers();
      setTimeout(sendStatus, 500);
      const drop = () => {
        if (calls.get(conn.peer) === call) { calls.delete(conn.peer); conns.delete(conn.peer); updateViewers(); }
      };
      call.on('close', drop); call.on('error', drop);
      conn.on('close', () => { call.close(); drop(); });
      conn.on('data', d => { if (d?.type === 'lens') switchLens(d.id); });
    });
  });
  peer.on('disconnected', () => {
    if (peer.destroyed || peer !== camPeer) return;
    camStatus('Reconectando con el servidor…', 'warn');
    setTimeout(() => { if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, 2000);
  });
  peer.on('error', err => {
    if (peer !== camPeer) return;
    if (err.type === 'unavailable-id') retryCam(code, 'Ya hay otra cámara abierta. Reintentando…', 5000);
    else if (['network','server-error','socket-error','socket-closed'].includes(err.type)) retryCam(code, 'Sin conexión. Reintentando…', 4000);
    else if (err.type !== 'peer-unavailable') camStatus('Error: ' + err.type, 'err');
  });
}

$('#btnDim').onclick = () => { $('#dim').hidden = false; };
$('#dim').onclick = () => { $('#dim').hidden = true; };
$('#btnCamBack').onclick = goHome;

/* ===================== MODO MONITOR ===================== */
let viewPeer, viewConn, viewCall, viewCode, retryTimer, remoteStream;
let live = false, lostSince = 0, audioCtx, analyser, meterSrc, lastStatusAt = 0;
const viewStatus = (t,c) => setStatus($('#viewStatus'), t, c);

function startViewer(code){
  activeMode = 'view'; show('view'); keepAwake();
  viewCode = code;
  history.replaceState(null, '', '?ver');
  viewPeer = new Peer(peerOptions());
  viewPeer.on('open', tryConnect);
  viewPeer.on('call', call => {
    if (viewCall && viewCall !== call) viewCall.close();
    viewCall = call; prevStats = null;
    call.answer();
    call.on('stream', s => {
      remoteStream = s; live = true; lostSince = 0;
      const v = $('#remoteVideo'); v.srcObject = s; v.play().catch(() => {});
      viewStatus('En directo', 'ok');
      startMeter();
    });
    call.on('close', () => lost(call));
    call.on('error', () => lost(call));
    const pc = call.peerConnection;
    pc?.addEventListener('iceconnectionstatechange', () => {
      const st = pc.iceConnectionState;
      if (st === 'failed' || st === 'closed') lost(call);
      else if (st === 'disconnected') setTimeout(() => {
        if (pc.iceConnectionState === 'disconnected') lost(call);
      }, 5000);
    });
  });
  viewPeer.on('disconnected', () => {
    setTimeout(() => { if (!viewPeer.destroyed && viewPeer.disconnected) viewPeer.reconnect(); }, 2000);
  });
  viewPeer.on('error', err => {
    if (live) return;
    viewStatus(err.type === 'peer-unavailable'
      ? 'La cámara no está conectada. Reintentando…'
      : 'Problema de conexión (' + err.type + '). Reintentando…', 'warn');
    scheduleRetry(4000);
  });
}

function scheduleRetry(ms){ clearTimeout(retryTimer); retryTimer = setTimeout(tryConnect, ms); }

function tryConnect(){
  clearTimeout(retryTimer);
  if (!viewPeer || viewPeer.destroyed || live) return;
  if (viewPeer.disconnected) { viewPeer.reconnect(); scheduleRetry(4000); return; }
  if (!lostSince) viewStatus('Conectando con la cámara…', 'warn');
  try { viewConn?.close(); } catch {}
  const conn = viewConn = viewPeer.connect(PREFIX + viewCode, { reliable: true });
  conn.on('close', () => { if (live && conn === viewConn) lost(viewCall); });
  conn.on('data', onCamData);
  scheduleRetry(15000); // si en 15 s no llega vídeo, se reintenta
}

function lost(call){
  if (call && call !== viewCall) return;
  if (!live && lostSince) return;
  live = false;
  if (!lostSince) lostSince = Date.now();
  try { viewCall?.close(); } catch {}
  viewCall = null;
  viewStatus('⚠️ Señal perdida. Reconectando…', 'err');
  scheduleRetry(2000);
}

// Datos recibidos del móvil de la cámara
function onCamData(d){
  if (d?.type !== 'status') return;
  lastStatusAt = Date.now();
  if (d.battery) {
    const b = d.battery, cls = b.level > 30 ? 'good' : b.level > 15 ? 'mid' : 'bad';
    $('#iBat').innerHTML = `<b class="${cls}">${b.level}%</b> ${b.charging ? '⚡ cargando' : '(sin cargar)'}`;
  } else $('#iBat').textContent = 'No disponible (Safari/iPhone no lo permite)';
  $('#iNet').textContent = d.net || 'No disponible (Safari/iPhone no lo permite)';
  renderLenses($('#viewLenses'), d.lenses || [], d.lens, id => {
    try { viewConn?.send({ type: 'lens', id }); } catch {}
  });
  $('#viewWrap').classList.toggle('zoom2', !!d.digitalZoom);
}

// Calidad de la conexión medida en este móvil
let prevStats = null;
async function readStats(){
  const pc = viewCall?.peerConnection;
  if (!pc || !live) return;
  const st = await pc.getStats();
  let inb, pair;
  st.forEach(r => {
    if (r.type === 'inbound-rtp' && r.kind === 'video') inb = r;
    if (r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId);
  });
  if (!pair) st.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; });
  let kbps = 0, loss = 0;
  if (inb && prevStats) {
    kbps = (inb.bytesReceived - prevStats.bytes) * 8 / (inb.timestamp - prevStats.ts);
    const dl = (inb.packetsLost || 0) - prevStats.lost, dr = inb.packetsReceived - prevStats.recv;
    loss = dl + dr > 0 ? Math.max(0, dl) / (dl + dr) * 100 : 0;
  }
  if (inb) prevStats = { bytes: inb.bytesReceived, ts: inb.timestamp, lost: inb.packetsLost || 0, recv: inb.packetsReceived };
  const rtt = pair?.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null;
  const relay = pair && [st.get(pair.localCandidateId), st.get(pair.remoteCandidateId)].some(c => c?.candidateType === 'relay');
  const fps = inb?.framesPerSecond ? Math.round(inb.framesPerSecond) : 0;
  let q = ['Buena', 'good'];
  if ((rtt ?? 0) > 600 || loss > 5 || fps < 5) q = ['Mala', 'bad'];
  else if ((rtt ?? 0) > 300 || loss > 1 || fps < 10) q = ['Regular', 'mid'];
  $('#iQual').innerHTML = `<b class="${q[1]}">${q[0]}</b>` + (loss ? ` · ${loss.toFixed(1)}% pérdidas` : '');
  $('#iRtt').textContent = rtt != null ? rtt + ' ms' : '—';
  $('#iVid').textContent = `${fps} fps · ${Math.round(kbps)} kbps` + (inb?.frameWidth ? ` · ${inb.frameWidth}×${inb.frameHeight}` : '');
  $('#iRoute').textContent = pair ? (relay ? 'Por servidor (TURN)' : 'Directa') : '—';
}

// Aviso si la señal se pierde o la cámara deja de responder
setInterval(() => {
  if (activeMode !== 'view') return;
  readStats().catch(() => {});
  if (live && lastStatusAt && Date.now() - lastStatusAt > 15000)
    viewStatus('⚠️ El móvil del bebé no responde (' + ago(Date.now() - lastStatusAt) + '). ¿Pantalla bloqueada?', 'warn');
  else if (live) viewStatus('En directo', 'ok');
  if (live || !lostSince) return;
  const secs = Math.round((Date.now() - lostSince) / 1000);
  viewStatus('⚠️ Sin señal desde hace ' + secs + ' s. Reconectando…', 'err');
  if (secs >= 20 && secs % 10 < 2) { beep(440, 2); navigator.vibrate?.([300,150,300]); }
}, 2000);

function beep(freq = 880, times = 2){
  if (!audioCtx) return;
  for (let i = 0; i < times; i++) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t0 = audioCtx.currentTime + i * 0.25;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.2);
  }
}

$('#btnSound').onclick = async () => {
  const v = $('#remoteVideo');
  v.muted = false; v.play().catch(() => {});
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  $('#btnSound').hidden = true; $('#soundCard').hidden = false;
  startMeter();
};

function startMeter(){
  if (!audioCtx || !remoteStream || !remoteStream.getAudioTracks().length) return;
  try { meterSrc?.disconnect(); } catch {}
  meterSrc = audioCtx.createMediaStreamSource(remoteStream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
  meterSrc.connect(analyser); // no se conecta a la salida: el audio ya suena por el vídeo
}

const thr = $('#threshold');
thr.value = store.get('threshold') || 60;
const updMark = () => { $('#meterMark').style.left = (100 - thr.value) + '%'; store.set('threshold', thr.value); };
thr.oninput = updMark; updMark();
for (const id of ['optBeep','optVibe']) {
  const el = $('#'+id);
  el.checked = store.get(id) !== '0';
  el.onchange = () => store.set(id, el.checked ? '1' : '0');
}

let loud = 0, lastAlarm = 0, lastNoiseAt = 0, dotTimer;
const buf = new Float32Array(1024);
setInterval(() => {
  if (lastNoiseAt) $('#lastNoise').textContent = 'Último ruido: ' + ago(Date.now() - lastNoiseAt);
  if (!analyser || !live) return;
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (const x of buf) sum += x * x;
  const db = 20 * Math.log10(Math.sqrt(sum / buf.length) || 1e-8);
  const level = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
  $('#meterBar').style.width = level + '%';
  const limit = 100 - thr.value; // más sensibilidad = umbral más bajo
  loud = level > limit ? loud + 1 : 0;
  if (loud >= 3) {
    lastNoiseAt = Date.now();
    // Punto rojo sobre la imagen mientras haya ruido (y 4 s después)
    $('#noiseDot').hidden = $('#noiseTag').hidden = false;
    clearTimeout(dotTimer);
    dotTimer = setTimeout(() => { $('#noiseDot').hidden = $('#noiseTag').hidden = true; }, 4000);
    if (Date.now() - lastAlarm > 5000) {
      lastAlarm = Date.now();
      if ($('#optBeep').checked) beep(880, 2);
      if ($('#optVibe').checked) navigator.vibrate?.([400,200,400]);
      const s = $('#view'); s.classList.remove('alarm'); void s.offsetWidth; s.classList.add('alarm');
    }
  }
}, 200);

$('#btnFull').onclick = () => {
  const w = $('#viewWrap'), v = $('#remoteVideo');
  if (w.requestFullscreen) w.requestFullscreen().catch(() => {});
  else (v.webkitEnterFullscreen || v.webkitRequestFullscreen)?.call(v);
};
$('#btnViewBack').onclick = goHome;

/* ===================== INICIO ===================== */
if (!window.isSecureContext) {
  $('#home').insertAdjacentHTML('beforeend',
    '<div class="status err">Esta página debe abrirse con https:// para poder usar la cámara.</div>');
}
$('#btnCam').onclick = startCamera;
$('#btnView').onclick = () => startViewer(ROOM);
if (new URLSearchParams(location.search).has('ver')) startViewer(ROOM);
</script>
